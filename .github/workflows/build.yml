name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build

      # 安装包名里有空格（随 productName），统一换成 - 再收集到 out/
      - name: 收集安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName ("out/" + ($_.Name -replace ' ', '-'))
          }
          Get-ChildItem out

      # 账号的 Actions 存储配额满时这一步会失败，不影响整体结果；安装包以 Release 为准
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hark-desk-windows
          path: out/*.exe
          retention-days: 3

      # main 每次构建覆盖一个 nightly 预发布（Release 不占 Actions 存储配额）
      - name: 发布 nightly（main）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag -y || true
          gh release create nightly out/*.exe --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_SHA::7}" --notes "main 最新构建（${GITHUB_SHA::7}），每次推送自动覆盖。"

      - name: Release（v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
